
spring:
 application:
   name: gateway-service
 cloud:
   gateway:
     server:
       webflux:
         routes:
           - id: product-service
             uri: http://product-service.product-service.svc.cluster.local:8081
             predicates:
               - Path=/api/products/**
             filters:
               - StripPrefix=2
              

           - id: user-service
             uri: http://user-service.user-service.svc.cluster.local:8082
             predicates:
               - Path=/api/users/**
             filters:
               - StripPrefix=2
               
           - id: review-service
             uri: http://review-service.review-service.svc.cluster.local:8083
             predicates:
               - Path=/api/reviews/**
             filters:
               - StripPrefix=2
  
           - id: order-service
             uri: http://order-service.order-service.svc.cluster.local:8084
             predicates:
               - Path=/api/orders/**
             filters:
               - StripPrefix=2

server:
  port: 8080

