
spring:
 application:
   name: gateway-service
 cloud:
   gateway:
     server:
       webflux:
         routes:
           - id: gateway-service
             uri: http://gateway-service.gateway-service.svc.cluster.local:8080
             predicates:
               - Path=/api/products/**
             filters:
               - StripPrefix=2
              

           - id: user-service
             uri: http://user-service.user-service.svc.cluster.local:8082
             predicates:
               - Path=/api/users/**
             filters:
               - StripPrefix=2

server:
  port: 8080

