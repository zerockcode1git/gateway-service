
spring:
 application:
   name: gateway-service
 cloud:
   gateway:
     server:
       webflux:
         routes:
           - id: gateway-service
             uri: http://localhost:8080
             predicates:
               - Path=/api/gateways/**
             filters:
               - StripPrefix=2
           - id: user-service
             uri: http://localhost:8082
             predicates:
               - Path=/api/users/**
             filters:
               - StripPrefix=2

server:
  port: 8080

